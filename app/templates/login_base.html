<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SafeSight AI – Login{% endblock %}</title>

  <!-- Google Font: Inter (same as base.html) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- SafeSight UI Stylesheet (unchanged) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  {% block extra_head %}{% endblock %}
</head>
<body class="login-body">

  {% block content %}{% endblock %}

  <!-- Theme is persisted by base.html pages; honour the saved preference here too -->
  <script>
    const saved = localStorage.getItem('safesight-theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
