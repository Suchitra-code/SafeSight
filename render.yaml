# Render deployment blueprint for SafeSight AI
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: safesight-ai
    runtime: python
    healthCheckPath: /healthz

    # Exact Render Build Command:
    # 1. Upgrades pip and installs all production dependencies
    # 2. Ensures YOLO model weights exist (downloads custom MODEL_URL or YOLOv8 safety base weights)
    # 3. Pre-initializes database tables and schema migrations
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python scripts/prepare_model.py && python database/init_db.py

    # Exact Render Start Command:
    # Uses Gunicorn WSGI server configured via gunicorn.conf.py:
    #   - 1 worker process (~387MB RSS, safely below Render 512MB limit)
    #   - gthread multi-threading (4 concurrent threads)
    #   - 300s timeout to prevent boot and deep-learning inference timeouts
    #   - preload_app=False so port binds immediately
    #   - /dev/shm for heartbeat tmpfs
    startCommand: gunicorn --config gunicorn.conf.py run:app

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"

      - key: FLASK_DEBUG
        value: "false"

      - key: SECRET_KEY
        generateValue: true

      - key: DEVICE
        value: "cpu"

      - key: CONFIDENCE_THRESHOLD
        value: "0.40"

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: DISABLE_SENTENCE_TRANSFORMERS
        value: "true"

      - key: YOLO_CONFIG_DIR
        value: "/tmp/ultralytics"

      - key: MPLCONFIGDIR
        value: "/tmp/matplotlib"
