# Render deployment configuration for SafeSight AI
# Docs: https://render.com/docs/blueprint-spec
#
# This file is optional — you can also configure the service manually
# in the Render dashboard using the values below.

services:
  - type: web
    name: safesight-ai
    runtime: python
    # Python version — must match the version you developed against
    pythonVersion: "3.11.0"

    # Install dependencies
    buildCommand: pip install -r requirements.txt

    # Gunicorn WSGI server:
    #   -w 2          → 2 worker processes (safe for 512 MB free tier)
    #   -b 0.0.0.0:$PORT → bind to all interfaces on Render's assigned port
    #   --timeout 120 → allow up to 120s for slow YOLOv8 model load on first request
    #   run:app       → import the `app` object from run.py (module-level create_app())
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 120 run:app

    envVars:
      # Disable Flask development server features in production
      - key: FLASK_DEBUG
        value: "false"

      # Generate a cryptographically random SECRET_KEY automatically on Render
      - key: SECRET_KEY
        generateValue: true

      # Force CPU inference (Render free tier has no GPU)
      - key: DEVICE
        value: "cpu"

      # Detection confidence threshold (can be tuned without redeploying)
      - key: CONFIDENCE_THRESHOLD
        value: "0.40"
