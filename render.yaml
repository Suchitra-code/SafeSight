# Render deployment blueprint for SafeSight AI
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: safesight-ai
    runtime: python
    pythonVersion: "3.11.0"

    # Exact Render Build Command:
    # 1. Upgrades pip and installs all production dependencies
    # 2. Ensures YOLO model weights exist (downloads custom MODEL_URL or YOLOv8 safety base weights)
    # 3. Pre-initializes database tables and schema migrations
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python scripts/prepare_model.py && python database/init_db.py

    # Exact Render Start Command:
    # Uses Gunicorn WSGI server:
    #   -w 2            → 2 worker processes (balanced for Render 512MB RAM)
    #   -b 0.0.0.0:$PORT → binds to Render dynamic port on all network interfaces
    #   --timeout 120   → prevents worker kill while loading PyTorch/YOLO model
    #   run:app         → loads Flask app instance from run.py
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 120 run:app

    envVars:
      - key: FLASK_DEBUG
        value: "false"

      - key: SECRET_KEY
        generateValue: true

      - key: DEVICE
        value: "cpu"

      - key: CONFIDENCE_THRESHOLD
        value: "0.40"

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: YOLO_CONFIG_DIR
        value: "/tmp/ultralytics"

      - key: MPLCONFIGDIR
        value: "/tmp/matplotlib"
